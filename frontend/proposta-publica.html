    <script>
    (function () {
        var raiz = document.getElementById('proposta-raiz');
        var fabBar = document.getElementById('pp-fab-bar');
        var secaoAceite = document.getElementById('proposta-aceite-secao');

        var modalAceite = document.getElementById('pp-modal-aceite');
        var modalAceiteBody = document.getElementById('pp-modal-aceite-body');
        var partes = location.pathname.replace(/\/+$/, '').split('/');
        var token = partes.pop();
        var codigo = partes.pop();
        var estado = { dados: null, boxes: null, view: null, aprovado: false };

        function esc(s) {
            return String(s === null || s === undefined ? '' : s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }
        function fmtMoeda(v) {
            return Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        function ehAprovadaInternamente(d) {
            var fn = String((d && d.fase_negociacao) || '').trim().toUpperCase();
            return fn === 'APROVADA' || fn === 'APROVADO - ADITIVO ASSINADO' || fn === 'ENVIADO PARA ASSINATURA';
        }
        function foiConfirmadaPeloCliente(d) {
            return Boolean(d && (d.aceite_publico_em || d.assinatura_url));
        }
        function formatarDataHoraBr(raw) {
            if (!raw) return '';
            var dt = new Date(String(raw).replace(' ', 'T'));
            if (!isNaN(dt.getTime())) return dt.toLocaleString('pt-BR');
            return String(raw);
        }

        function gerarHtmlVersaoSimples(d) {
            if (!d) return '';
            var prodsAprovArr = Array.isArray(d.produtos_aprovados) ? d.produtos_aprovados.filter(Boolean) : [];
            var htmlProdsAprov = prodsAprovArr.length > 0 ? (
                '<div style="margin:8px auto 10px auto; max-width:620px; background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px; padding:8px 14px; text-align:left;">' +
                '<div style="font-size:11.5px; font-weight:800; color:#1e40af; text-transform:uppercase; margin-bottom:4px;">Produto(s) Aprovado(s):</div>' +
                prodsAprovArr.map(function (p) { return '<div style="font-size:12px; font-weight:700; color:#0f172a;">• ' + esc(p) + '</div>'; }).join('') +
                '</div>'
            ) : '';
            if (typeof window.renderBoxQuadroEventoHtml === 'function') {
                var htmlQuadro = window.renderBoxQuadroEventoHtml(d, 'desktop', { modelo_tipo: d.modelo_tipo || 'EVENTO' });
                var urlAditivo = (d.eh_aditivo && d.aditivo && d.aditivo.url) ? d.aditivo.url : '';
                var htmlAditivo = urlAditivo ? ('<img src="' + esc(urlAditivo) + '" alt="Imagem de Aditivo" style="width:100%; height:auto; display:block;">') : '';
                var urlAceite = (d.aceite && d.aceite.url) ? d.aceite.url : '';
                var htmlAceite = urlAceite ? ('<img src="' + esc(urlAceite) + '" alt="Aceite da Proposta" style="width:100%; height:auto; display:block;">') : '';
                var htmlAssinatura = ehAprovadaInternamente(d) ? (
                    '<div style="padding:22px 24px; border-top:2px solid #86efac; background:#f0fdf4; text-align:center; font-family:Arial,sans-serif;">' +
                    '<div style="font-size:14px; font-weight:800; color:#15803d; margin-bottom:8px; text-transform:uppercase;">Proposta Aprovada Internamente</div>' +
                    htmlProdsAprov +
                    '<div style="font-size:13px; color:#0f172a; font-weight:600;">Aprovado por: <strong>' + esc(d.aprovado_por || 'Sistema') + '</strong></div>' +
                    (d.aprovado_em ? '<div style="font-size:11.5px; color:#475569; margin-top:4px;">Data/Hora da aprovação: ' + esc(formatarDataHoraBr(d.aprovado_em)) + '</div>' : '') +
                    '</div>'
                ) : (foiConfirmadaPeloCliente(d) ? (
                    '<div style="padding:20px 24px; border-top:2px solid #cbd5e1; background:#f8fafc; text-align:center; font-family:Arial,sans-serif;">' +
                    '<div style="font-size:13px; font-weight:700; color:#16a34a; margin-bottom:8px; text-transform:uppercase;">✓ Proposta Confirmada pelo Cliente</div>' +
                    htmlProdsAprov +
                    (d.aceite_publico_em ? '<div style="font-size:11px; color:#475569; margin-top:6px;">Confirmado eletronicamente em ' + esc(formatarDataHoraBr(d.aceite_publico_em)) + '</div>' : '') +
                    '</div>'
                ) : '');
                return '<div style="max-width:960px; margin:0 auto; background:#fff;">' + htmlQuadro + htmlAditivo + htmlAceite + htmlAssinatura + '</div>';
            }
            var imp = d.impressao_simples || {};
            var c = imp.contratada || {
                razao_social: 'AMERICA RENTAL EQUIPAMENTOS LTDA',
                cnpj: '03.434.448/0001-01',
                ie: '336.715.410.116',
                endereco: 'RUA SALTO DA DIVISA , 97, CIDADE PARQUE ALVORADA GUARULHOS /SP - CEP: 07242-300',
                telefone: '(11) 2499-3353',
                celular: '(11) 99104-2685',
                representante: 'Comercial',
                email_representante: 'comercial2@americarental.com.br'
            };
            var cli = imp.cliente || {
                razao_social: d.razao_social || '—',
                cnpj: d.cnpj || '—',
                ie: 'ISENTO',
                endereco: d.instalacao_linha2 || '—',
                municipio: 'SAO PAULO',
                uf: 'SP',
                cep: '—',
                contato_nome: d.contato_nome || '—',
                contato_telefone: '—',
                contato_celular: d.contato_celular || '—',
                contato_email: '—'
            };
            var tituloDoc = imp.titulo_documento || ('PROPOSTA ' + (d.tipo_titulo || 'COMERCIAL') + ' Nº ' + (d.codigo_proposta || d.contrato || '01'));
            var itens = Array.isArray(d.itens) ? d.itens : [];
            var servicos = Array.isArray(d.servicos) ? d.servicos : [];
            var isEquip = false;
            var somaBrutaItens = 0;
            var somaDescontoItens = 0;
            itens.forEach(function (it) {
                var qt = Number(it.quantidade || 1);
                var diar = Number(it.quant_diarias || 1) || 1;
                var unit = Number(it.unit || 0);
                var bruto = qt * unit * diar;
                var liq = Number(it.total !== undefined ? it.total : bruto);
                var desc = Number(it.desconto || Math.max(0, bruto - liq));
                somaBrutaItens += bruto;
                somaDescontoItens += desc;
            });
            var totalLiquidoItens = Math.max(0, somaBrutaItens - somaDescontoItens);

            var tabelaProdutosHtml = '';
            if (isEquip) {
                tabelaProdutosHtml = '<table style="width:100%; border-collapse:collapse; font-size:11px; color:#1e293b; margin-top:2px;">' +
                    '<thead><tr style="border-bottom:1px solid #cbd5e1; color:#334155; font-weight:700;">' +
                    '<th style="text-align:left; padding:5px 6px;">Descrição</th>' +
                    '<th style="text-align:left; padding:5px 6px;">Observação</th>' +
                    '<th style="text-align:center; padding:5px 6px; width:55px;">Qtde</th>' +
                    '<th style="text-align:right; padding:5px 6px; width:85px;">Vlr Diária</th>' +
                    '<th style="text-align:center; padding:5px 6px; width:60px;">Diárias</th>' +
                    '<th style="text-align:right; padding:5px 6px; width:95px;">Total da Diária</th>' +
                    '<th style="text-align:right; padding:5px 6px; width:90px;">Total</th>' +
                    '</tr></thead><tbody>' +
                    itens.map(function (it) {
                        var qt = Number(it.quantidade || 1);
                        var vUnit = Number(it.unit || 0);
                        var diar = Number(it.quant_diarias || 1) || 1;
                        var totDiar = vUnit * diar;
                        var tot = Number(it.total !== undefined ? it.total : (qt * totDiar));
                        return '<tr style="border-bottom:1px solid #e2e8f0;">' +
                            '<td style="padding:5px 6px;">' + esc(it.nome) + '</td>' +
                            '<td style="padding:5px 6px;">' + esc(it.observacao || '') + '</td>' +
                            '<td style="padding:5px 6px; text-align:center;">' + qt + '</td>' +
                            '<td style="padding:5px 6px; text-align:right;">' + fmtMoeda(vUnit) + '</td>' +
                            '<td style="padding:5px 6px; text-align:center;">' + diar + '</td>' +
                            '<td style="padding:5px 6px; text-align:right;">' + fmtMoeda(totDiar) + '</td>' +
                            '<td style="padding:5px 6px; text-align:right;">' + (it.cortesia ? 'CORTESIA' : fmtMoeda(tot)) + '</td>' +
                            '</tr>';
                    }).join('') +
                    '</tbody><tfoot>' +
                    '<tr><td colspan="6" style="padding:6px 6px 2px 6px; text-align:right; font-weight:700;">TOTAL</td><td style="padding:6px 6px 2px 6px; text-align:right; font-weight:700;">R$ ' + fmtMoeda(somaBrutaItens) + '</td></tr>' +
                    (somaDescontoItens > 0 ? '<tr><td colspan="6" style="padding:2px 6px; text-align:right; font-weight:700;">DESCONTO</td><td style="padding:2px 6px; text-align:right; font-weight:700;">R$ ' + fmtMoeda(somaDescontoItens) + '</td></tr>' : '') +
                    (somaDescontoItens > 0 ? '<tr><td colspan="6" style="padding:2px 6px 6px 6px; text-align:right; font-weight:700;">TOTAL COM DESCONTO</td><td style="padding:2px 6px 6px 6px; text-align:right; font-weight:700;">R$ ' + fmtMoeda(totalLiquidoItens) + '</td></tr>' : '') +
                    '</tfoot></table>';
            } else {
                tabelaProdutosHtml = '<table style="width:100%; border-collapse:collapse; font-size:11px; color:#1e293b; margin-top:2px;">' +
                    '<thead><tr style="border-bottom:1px solid #cbd5e1; color:#334155; font-weight:700;">' +
                    '<th style="text-align:left; padding:5px 6px;">Descrição</th>' +
                    '<th style="text-align:left; padding:5px 6px;">Observação</th>' +
                    '<th style="text-align:center; padding:5px 6px; width:55px;">Qtde</th>' +
                    '<th style="text-align:center; padding:5px 6px; width:60px;">Diárias</th>' +
                    '<th style="text-align:right; padding:5px 6px; width:95px;">Valor Unitário</th>' +
                    '<th style="text-align:right; padding:5px 6px; width:95px;">Total</th>' +
                    '</tr></thead><tbody>' +
                    itens.map(function (it) {
                        var qt = Number(it.quantidade || 1);
                        var diar = Number(it.quant_diarias || 1) || 1;
                        var vUnit = Number(it.unit || 0);
                        var tot = Number(it.total !== undefined ? it.total : (qt * vUnit * diar));
                        return '<tr style="border-bottom:1px solid #e2e8f0;">' +
                            '<td style="padding:5px 6px;">' + esc(it.nome) + '</td>' +
                            '<td style="padding:5px 6px;">' + esc(it.observacao || '') + '</td>' +
                            '<td style="padding:5px 6px; text-align:center;">' + qt + '</td>' +
                            '<td style="padding:5px 6px; text-align:center;">' + diar + '</td>' +
                            '<td style="padding:5px 6px; text-align:right;">' + fmtMoeda(vUnit) + '</td>' +
                            '<td style="padding:5px 6px; text-align:right;">' + (it.cortesia ? 'CORTESIA' : fmtMoeda(tot)) + '</td>' +
                            '</tr>';
                    }).join('') +
                    '</tbody><tfoot>' +
                    (somaDescontoItens > 0 ? '<tr><td colspan="5" style="padding:4px 6px 2px 6px; text-align:right; font-weight:700;">DESCONTO</td><td style="padding:4px 6px 2px 6px; text-align:right; font-weight:700;">R$ ' + fmtMoeda(somaDescontoItens) + '</td></tr>' : '') +
                    '<tr><td colspan="5" style="padding:6px; text-align:right; font-weight:700;">VALOR TOTAL DOS PRODUTOS</td><td style="padding:6px; text-align:right; font-weight:700;">R$ ' + fmtMoeda(totalLiquidoItens) + '</td></tr>' +
                    '</tfoot></table>';
            }

            var valoresCompHtml = servicos.length > 0 ? (
                '<div style="margin-top:10px; border-top:1px solid #cbd5e1; border-bottom:1px solid #cbd5e1; padding:5px 0; text-align:center; font-weight:700; font-size:12px; color:#475569;">Serviços / Valores Complementares</div>' +
                '<table style="width:100%; border-collapse:collapse; font-size:11px; color:#1e293b; margin-top:2px;">' +
                '<thead><tr style="border-bottom:1px solid #cbd5e1; color:#334155; font-weight:700;">' +
                '<th style="text-align:left; padding:5px 6px;">Descrição</th>' +
                '<th style="text-align:left; padding:5px 6px;">Observação</th>' +
                '<th style="text-align:right; padding:5px 6px; width:110px;">Valor</th>' +
                '</tr></thead><tbody>' +
                servicos.map(function (sv) {
                    var valExib = sv.fob ? 'FOB' : (sv.cortesia ? 'CORTESIA' : ('R$ ' + fmtMoeda(sv.total)));
                    return '<tr style="border-bottom:1px solid #e2e8f0;">' +
                        '<td style="padding:5px 6px;">' + esc(sv.nome) + '</td>' +
                        '<td style="padding:5px 6px;">' + esc(sv.observacao || '') + '</td>' +
                        '<td style="padding:5px 6px; text-align:right;">' + valExib + '</td>' +
                        '</tr>';
                }).join('') +
                '</tbody></table>'
            ) : '';

            var linhasInfo = Array.isArray(imp.linhas_informacoes) ? imp.linhas_informacoes : [];
            var tituloInfo = imp.titulo_informacoes !== undefined ? imp.titulo_informacoes : 'Informações:';
            var infoBoxHtml = (tituloInfo || linhasInfo.length > 0) ? (
                '<div style="margin-top:14px; border:1px solid #cbd5e1; border-radius:6px; padding:10px 14px; background:#fff;">' +
                (tituloInfo ? '<div style="font-weight:700; font-size:11.5px; color:#1e293b; margin-bottom:6px;">' + esc(tituloInfo) + '</div>' : '') +
                '<div style="display:flex; flex-direction:column; gap:5px; font-size:11px; line-height:1.45; color:#1e293b; text-align:justify;">' +
                linhasInfo.map(function (l) { return '<div>' + esc(l) + '</div>'; }).join('') +

            ) : '';

            return '<div class="america-proposta-sheet" style="background:#fff; color:#1e293b; font-family:Arial, Helvetica, sans-serif; font-size:11.5px; line-height:1.4; max-width:820px; margin:0 auto; padding:12px 16px; box-sizing:border-box;">' +
                '<div style="padding-bottom:8px; margin-bottom:10px; border-bottom:1px solid #cbd5e1;">' +
                '<img src="/assets/logo-header.png" alt="América Rental" style="width:100%; max-height:92px; object-fit:contain; object-position:left center; display:block;">' +
                '</div>' +
                '<div style="border:1px solid #cbd5e1; border-radius:4px; padding:12px 14px; box-sizing:border-box;">' +
                '<div style="border-top:1px solid #cbd5e1; border-bottom:1px solid #cbd5e1; padding:6px 8px; text-align:center; font-weight:700; font-size:13px; color:#1e293b; text-transform:uppercase; letter-spacing:0.02em; margin-bottom:10px;">' + esc(tituloDoc) + '</div>' +
                '<div style="padding-bottom:9px; margin-bottom:9px; border-bottom:1px solid #cbd5e1; font-size:11px; line-height:1.45;">' +
                '<div style="font-weight:700; font-size:11.5px; color:#0f172a;">' + esc(c.razao_social) + '</div>' +
                '<div><strong>CNPJ:</strong> ' + esc(c.cnpj) + ' - <strong>IE:</strong> ' + esc(c.ie) + '</div>' +
                '<div><strong>Endereço:</strong> ' + esc(c.endereco) + '</div>' +
                '<div><strong>Representante:</strong> ' + esc(c.representante) + ' - <strong>Telefone:</strong> ' + esc(c.telefone) + ' <strong>Celular:</strong> ' + esc(c.celular) + ' <strong>Email:</strong> ' + esc(c.email_representante) + '</div>' +
                '</div>' +
                '<div style="padding-bottom:9px; margin-bottom:9px; border-bottom:1px solid #cbd5e1; font-size:11px; line-height:1.45;">' +
                '<div style="font-weight:700; font-size:11.5px; color:#0f172a;">' + esc(cli.razao_social) + '</div>' +
                '<div><strong>CNPJ:</strong> ' + esc(cli.cnpj) + ' &nbsp;&nbsp; <strong>IE:</strong> ' + esc(cli.ie) + '</div>' +
                '<div><strong>Endereço:</strong> ' + esc(cli.endereco) + ' &nbsp; <strong>Município:</strong> ' + esc(cli.municipio) + ' - <strong>UF:</strong> ' + esc(cli.uf) + ' &nbsp; <strong>CEP:</strong> ' + esc(cli.cep) + '</div>' +
                '<div><strong>Contato:</strong> ' + esc(cli.contato_nome) + ' &nbsp; <strong>Telefone:</strong> ' + esc(cli.contato_telefone) + ' &nbsp; <strong>Celular:</strong> ' + esc(cli.contato_celular) + ' &nbsp; <strong>E-mail:</strong> ' + esc(cli.contato_email) + '</div>' +
                (d.eh_aditivo || d.contrato_vinculado ? '<div><strong>Contrato Base:</strong> ' + esc(d.contrato_vinculado || '—') + '</div>' : '') +
                '</div>' +
                '<div style="display:grid; grid-template-columns:1.2fr 1.1fr 0.9fr; gap:8px; padding-bottom:8px; margin-bottom:8px; border-bottom:1px solid #cbd5e1; font-size:11px;">' +
                '<div><strong>Período:</strong> ' + esc(d.data_inicio || '—') + (d.data_fim && d.data_fim !== d.data_inicio ? ' à ' + esc(d.data_fim) : '') + '</div>' +
                '<div><strong>Condição de Pagamento:</strong> ' + esc(d.condicao_pagamento || '—') + '</div>' +
                '<div style="text-align:right;"><strong>Validade da proposta:</strong> ' + esc(d.validade_proposta || '—') + '</div>' +
                '</div>' +
                '<div style="padding-bottom:9px; margin-bottom:6px; font-size:11px; line-height:1.45;">' +
                '<div><strong>Local de instalação:</strong> ' + esc(imp.local_instalacao || d.instalacao_linha1 || '—') + '</div>' +
                '<div><strong>Endereço:</strong> ' + esc(imp.endereco_instalacao || d.instalacao_linha2 || '—') + '</div>' +
                '<div><strong>CEP:</strong> ' + esc(imp.cep_instalacao || cli.cep || '—') + '</div>' +
                '</div>' +
                '<div style="border-top:1px solid #cbd5e1; border-bottom:1px solid #cbd5e1; padding:5px 0; text-align:center; font-weight:700; font-size:12px; color:#475569;">' + esc(imp.titulo_tabela_produtos || 'Produtos para Locação') + '</div>' +
                tabelaProdutosHtml +
                valoresCompHtml +
                infoBoxHtml +
                (imp.observacao ? '<div style="margin-top:12px;"><div style="text-align:center; font-weight:700; font-size:11.5px; color:#475569; margin-bottom:4px;">Observação</div><div style="border:1px solid #cbd5e1; border-radius:4px; padding:8px 10px; min-height:34px; font-size:11px; color:#1e293b; white-space:pre-wrap;">' + esc(imp.observacao) + '</div></div>' : '') +
                '</div></div>';
        }

        function obterUrlImagemAceite() {
            if (!estado.dados || !estado.dados.aceite) return null;
            if (visao() === 'mobile' && estado.dados.aceite.mobile_url) return estado.dados.aceite.mobile_url;
            return estado.dados.aceite.url || null;
        }

        function obterUrlImagemAditivo() {
            if (!estado.dados || !estado.dados.eh_aditivo || !estado.dados.aditivo) return null;
            if (visao() === 'mobile' && estado.dados.aditivo.mobile_url) return estado.dados.aditivo.mobile_url;
            return estado.dados.aditivo.url || null;
        }

        function montarHtmlQuadroAditivoAceite(modoVisao) {
            var d = estado.dados || {};
            var v = modoVisao || visao();
            var htmlQuadro = '';
            if (typeof window.renderBoxQuadroEventoHtml === 'function') {
                htmlQuadro = window.renderBoxQuadroEventoHtml(d, v, { modelo_tipo: d.modelo_tipo || 'EVENTO' });
            }
            var urlAditivo = obterUrlImagemAditivo();
            var htmlAditivo = urlAditivo ? '<img src="' + esc(urlAditivo) + '" alt="Informação de Aditivo" style="width:100%; height:auto; display:block;">' : '';
            var urlImg = obterUrlImagemAceite();
            var htmlAceite = urlImg ? '<img src="' + esc(urlImg) + '" alt="Aceite da Proposta" style="width:100%; height:auto; display:block;">' : '';
            return '<div style="max-width:960px; margin:0 auto; background:#fff;">' + htmlQuadro + htmlAditivo + htmlAceite + '</div>';
        }

        function montarHtmlBlocoAssinaturaSalva() {
            var d = estado.dados || {};
            var isAprovInterna = ehAprovadaInternamente(d);
            var isConfirmadaCliente = foiConfirmadaPeloCliente(d) || estado.aprovado;
            if (!isConfirmadaCliente && !isAprovInterna) return '';
            var prodsAprovArr = Array.isArray(d.produtos_aprovados) ? d.produtos_aprovados.filter(Boolean) : [];
            var htmlProdsAprovSalvos = prodsAprovArr.length > 0 ? (
                '<div style="margin:6px auto 10px auto; max-width:560px; background:#eff6ff; border:1px solid #bfdbfe; border-radius:8px; padding:8px 14px; text-align:left;">' +
                '<div style="font-size:12px; font-weight:800; color:#1e40af; text-transform:uppercase; margin-bottom:4px;">Produto(s) Aprovado(s):</div>' +
                prodsAprovArr.map(function (p) { return '<div style="font-size:12.5px; font-weight:700; color:#0f172a;">• ' + esc(p) + '</div>'; }).join('') +
                '</div>'
            ) : '';
            if (isAprovInterna) {
                return '<div id="pp-bloco-assinatura-confirmada" style="max-width:960px; margin:0 auto; padding:22px 24px; background:#f0fdf4; border-top:2px solid #86efac; text-align:center; box-sizing:border-box;">' +
                    '<div style="font-size:15px; font-weight:800; color:#15803d; margin-bottom:8px; text-transform:uppercase;">Proposta Aprovada Internamente</div>' +
                    htmlProdsAprovSalvos +
                    '<div style="font-size:13.5px; color:#0f172a; font-weight:600;">Aprovado por: <strong>' + esc(d.aprovado_por || 'Sistema') + '</strong></div>' +
                    (d.aprovado_em ? '<div style="font-size:12px; color:#475569; margin-top:4px;">Data/Hora da aprovação: ' + esc(formatarDataHoraBr(d.aprovado_em)) + '</div>' : '') +
                    '</div>';
            }
            return '<div id="pp-bloco-assinatura-confirmada" style="max-width:960px; margin:0 auto; padding:20px 24px; background:#f8fafc; border-top:1px solid #e2e8f0; text-align:center; box-sizing:border-box;">' +
                '<div style="font-size:15px; font-weight:800; color:#16a34a; margin-bottom:8px;">✓ Proposta Confirmada!</div>' +
                htmlProdsAprovSalvos +
                (d.aceite_publico_em ? '<div style="font-size:12px; color:#64748b; margin-top:6px;">Data/Hora da Confirmação: ' + esc(formatarDataHoraBr(d.aceite_publico_em)) + '</div>' : '') +
                '</div>';
        }

        function exibirImagemAceite() {
            var d = estado.dados || {};
            var jaAssinadoOuAprovado = !!(foiConfirmadaPeloCliente(d) || estado.aprovado || ehAprovadaInternamente(d));
            if (jaAssinadoOuAprovado) {
                modalAceiteBody.innerHTML =
                    montarHtmlQuadroAditivoAceite(visao()) +
                    montarHtmlBlocoAssinaturaSalva();
                modalAceite.style.display = 'flex';
                if (typeof window.ajustarAlturaQuadroValoresBoxes === 'function') {
                    requestAnimationFrame(function () { window.ajustarAlturaQuadroValoresBoxes(modalAceiteBody); });
                }
                return;
            }

            var isComparativa = !!(d.proposta_comparativa && Array.isArray(d.itens) && d.itens.length > 0);
            var blocoSelecaoProdutosHtml = '';
            if (isComparativa) {
                blocoSelecaoProdutosHtml =
                    '<div style="max-width:560px; margin:0 auto 16px auto; background:#eff6ff; border:1.5px solid #93c5fd; border-radius:10px; padding:12px 16px; text-align:left;">' +
                    '<div style="font-size:13.5px; font-weight:800; color:#1e3a8a; margin-bottom:8px;">Selecione qual(is) produto(s) da proposta estão sendo aprovados: *</div>' +
                    '<div style="display:flex; flex-direction:column; gap:8px;">' +
                    d.itens.map(function (it, idx) {
                        var rotuloProd = String(it.nome || 'Produto ' + (idx + 1)).trim() +
                            (it.quantidade ? ' (Qtd: ' + it.quantidade + ')' : '') +
                            (!it.cortesia && !it.fob && it.total !== undefined ? ' — R$ ' + fmtMoeda(it.total) : '');
                        return '<label style="display:flex; align-items:flex-start; gap:8px; font-size:13px; font-weight:700; color:#0f172a; cursor:pointer; background:#fff; padding:8px 10px; border-radius:6px; border:1px solid #cbd5e1;">' +
                            '<input type="checkbox" class="pp-chk-prod-comparativa" value="' + esc(rotuloProd) + '" style="width:17px; height:17px; margin-top:1px; accent-color:#1d4ed8; cursor:pointer;">' +
                            '<span>' + esc(rotuloProd) + '</span>' +
                            '</label>';
                    }).join('') +
                    '</div>' +
                    '<div id="pp-produtos-erro" style="display:none; color:#dc2626; font-size:12.5px; font-weight:700; margin-top:8px;">Selecione pelo menos um produto que está sendo aprovado.</div>' +
                    '</div>';
            }

            modalAceiteBody.innerHTML =
                montarHtmlQuadroAditivoAceite(visao()) +
                '<div style="max-width:960px; margin:0 auto; padding:20px 24px; background:#f8fafc; border-top:2px solid #e2e8f0; text-align:center; box-sizing:border-box;">' +
                blocoSelecaoProdutosHtml +
                '<div style="display:flex; justify-content:center; gap:12px; margin-top:6px; flex-wrap:wrap;">' +
                '<button type="button" id="pp-btn-confirmar-assinatura" style="padding:12px 32px; border-radius:8px; border:none; background:#16a34a; color:#fff; font-weight:800; font-size:14.5px; cursor:pointer; box-shadow:0 4px 12px rgba(22,163,74,0.28);">✓ Confirmar</button>' +
                '</div>' +
                '</div>';
            modalAceite.style.display = 'flex';
            if (typeof window.ajustarAlturaQuadroValoresBoxes === 'function') {
                requestAnimationFrame(function () { window.ajustarAlturaQuadroValoresBoxes(modalAceiteBody); });
            }

            var btnConfirmar = document.getElementById('pp-btn-confirmar-assinatura');
            if (btnConfirmar) {
                btnConfirmar.addEventListener('click', function () {
                    var prodsSelecionados = [];
                    if (isComparativa) {
                        var chks = document.querySelectorAll('.pp-chk-prod-comparativa:checked');
                        chks.forEach(function (c) { if (c.value) prodsSelecionados.push(c.value); });
                        var erroProdEl = document.getElementById('pp-produtos-erro');
                        if (prodsSelecionados.length === 0) {
                            if (erroProdEl) erroProdEl.style.display = 'block';
                            return;
                        } else if (erroProdEl) {
                            erroProdEl.style.display = 'none';
                        }
                    }
                    btnConfirmar.disabled = true;
                    btnConfirmar.textContent = 'Confirmando...';
                    fetch('/api/public/proposta/' + encodeURIComponent(codigo) + '/' + encodeURIComponent(token) + '/aprovar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        credentials: 'omit',
                        referrerPolicy: 'no-referrer',
                        body: JSON.stringify({ confirmar_sem_assinatura: true, produtos_aprovados: prodsSelecionados })
                    }).then(function (r) { return r.json(); }).then(function (resp) {
                        if (resp && resp.error) {
                            btnConfirmar.disabled = false;
                            btnConfirmar.textContent = '✓ Confirmar';
                            alert(resp.error);
                            return;
                        }
                        estado.aprovado = true;
                        if (estado.dados) {
                            estado.dados.aceite_publico_em = (resp && resp.aceite_publico_em) || new Date().toISOString();
                            if (prodsSelecionados.length > 0) {
                                estado.dados.produtos_aprovados = prodsSelecionados;
                                if (Array.isArray(estado.dados.itens)) {
                                    var somaAprovItens = 0;
                                    estado.dados.itens = estado.dados.itens.map(function (it, idxIt) {
                                        var rotuloIt = String(it.nome || 'Produto ' + (idxIt + 1)).trim() +
                                            (it.quantidade ? ' (Qtd: ' + it.quantidade + ')' : '') +
                                            (!it.cortesia && !it.fob && it.total !== undefined ? ' — R$ ' + fmtMoeda(it.total) : '');
                                        var aprovIt = prodsSelecionados.indexOf(rotuloIt) >= 0;
                                        if (aprovIt && !it.cortesia && !it.fob) {
                                            somaAprovItens += Number(it.total || 0);
                                        }
                                        return Object.assign({}, it, {
                                            aprovado_comparativa: aprovIt,
                                            nao_aprovado: !aprovIt
                                        });
                                    });
                                    var somaServAtuais = (Array.isArray(estado.dados.servicos) ? estado.dados.servicos : []).reduce(function (acc, s) {
                                        return acc + (!s.fob && !s.cortesia ? Number(s.total || 0) : 0);
                                    }, 0);
                                    estado.dados.total_produtos = somaAprovItens;
                                    estado.dados.valor_total = somaAprovItens + somaServAtuais;
                                }
                            }
                            if (containerSimples) containerSimples.innerHTML = gerarHtmlVersaoSimples(estado.dados);
                        }
                        modalAceite.style.display = 'none';
                        desenhar();
                        window.location.reload();
                    }).catch(function () {
                        btnConfirmar.disabled = false;
                        btnConfirmar.textContent = '✓ Confirmar';
                    });
                });
            }
        }

        document.getElementById('pp-btn-imprimir').addEventListener('click', function () {
            if (!estado.dados) return;
            containerSimples.innerHTML = gerarHtmlVersaoSimples(estado.dados);
            window.print();
        });

        document.getElementById('pp-btn-aprovar').addEventListener('click', function () {
            if (!estado.dados) return;
            exibirImagemAceite();
        });

        function mensagem(titulo, texto) {
            raiz.style.background = 'transparent';
            raiz.innerHTML = '<div class="pp-msg"><h1></h1><p></p></div>';
            raiz.querySelector('h1').textContent = titulo;
            raiz.querySelector('p').textContent = texto;
        }

        function visao() { return window.innerWidth <= 768 ? 'mobile' : 'desktop'; }

        function desenhar() {
            if (!estado.dados) return;
            var v = visao();
            estado.view = v;
            var d = estado.dados;
            var jaAssinadoOuAprovado = !!(foiConfirmadaPeloCliente(d) || estado.aprovado || ehAprovadaInternamente(d));
            var btnAprovarEl = document.getElementById('pp-btn-aprovar');
            var boxesParaRender = jaAssinadoOuAprovado
                ? (estado.boxes || []).filter(function (b) { return !b || !b.origem_aditivo; })
                : (estado.boxes || []);
            if (typeof window.renderListaBoxesCompletaHtml === 'function') {
                raiz.innerHTML = window.renderListaBoxesCompletaHtml(boxesParaRender, v, { proposta: estado.dados });
            } else {
                raiz.innerHTML = boxesParaRender.map(function (b) {
                    return window.boxRenderHtml(b, v, { proposta: estado.dados });
                }).join('');
            }
            if (jaAssinadoOuAprovado) {
                var urlAdtFinal = obterUrlImagemAditivo();
                var htmlAdtFinal = urlAdtFinal ? '<img src="' + esc(urlAdtFinal) + '" alt="Informação de Aditivo" style="width:100%; height:auto; display:block;">' : '';
                var urlAceiteFinal = obterUrlImagemAceite();
                var htmlAceiteFinal = urlAceiteFinal ? '<img src="' + esc(urlAceiteFinal) + '" alt="Aceite da Proposta" style="width:100%; height:auto; display:block;">' : '';
                if (secaoAceite) {
                    secaoAceite.innerHTML = htmlAdtFinal + htmlAceiteFinal + montarHtmlBlocoAssinaturaSalva();
                    secaoAceite.style.display = 'block';
                }
            } else if (secaoAceite) {
                secaoAceite.innerHTML = '';
                secaoAceite.style.display = 'none';
            }
            if (btnAprovarEl) btnAprovarEl.style.display = 'inline-flex';
            if (fabBar) fabBar.style.display = 'flex';
            if (containerSimples) containerSimples.innerHTML = gerarHtmlVersaoSimples(estado.dados);
            if (typeof window.ajustarAlturaQuadroValoresBoxes === 'function') {
                requestAnimationFrame(function () { window.ajustarAlturaQuadroValoresBoxes(raiz); });
            }
        }

        var ultimaVisao = null;
        window.addEventListener('resize', function () {
            if (estado.dados && visao() !== ultimaVisao) { ultimaVisao = visao(); desenhar(); }
        });

        if (!codigo || !token) { mensagem('Link inválido', 'Confira o endereço recebido ou solicite um novo link.'); return; }

        fetch('/api/public/proposta/' + encodeURIComponent(codigo) + '/' + encodeURIComponent(token), {
            headers: { 'Accept': 'application/json' }, cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer'
        }).then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, body: j }; });
        }).then(function (r) {
            if (r.status === 200 && r.body && r.body.dados) {
                estado.dados = r.body.dados;
                estado.boxes = r.body.boxes || [{ tipo: 'quadro_evento' }];
                ultimaVisao = visao();
                desenhar();
            } else if (r.status === 410) {
                mensagem('Proposta expirada', 'Este link não está mais ativo. Entre em contato com a América Rental para receber uma nova proposta.');
            } else if (r.status === 429) {
                mensagem('Muitas tentativas', 'Aguarde alguns minutos e tente novamente.');
            } else {
                mensagem('Link inválido ou expirado', 'Confira o endereço recebido ou solicite um novo link à América Rental.');
            }
        }).catch(function () {
            mensagem('Não foi possível carregar', 'Verifique sua conexão e atualize a página.');
        });
    })();
    </script>
</body>
</html>
