                var bruto = qt * unit * diar;

                somaBrutaItens += bruto;
                somaDescontoItens += desc;
            });
            var totalLiquidoItens = Math.max(0, somaBrutaItens - somaDescontoItens);

            var tabelaProdutosHtml = '';
            if (isEquip) {
                tabelaProdutosHtml = '<table style="width:100%; border-collapse:collapse; font-size:11px; color:#1e293b; margin-top:2px;">' +

                    '</tr></thead><tbody>' +
                    itens.map(function (it) {

            } else {

                    '<thead><tr style="border-bottom:1px solid #cbd5e1; color:#334155; font-weight:700;">' +
                    '<th style="text-align:left; padding:5px 6px;">Descrição</th>' +

                    itens.map(function (it) {

            return '<div class="america-proposta-sheet" style="background:#fff; color:#1e293b; font-family:Arial, Helvetica, sans-serif; font-size:11.5px; line-height:1.4; max-width:820px; margin:0 auto; padding:12px 16px; box-sizing:border-box;">' +
                '<div style="padding-bottom:8px; margin-bottom:10px; border-bottom:1px solid #cbd5e1;">' +

                '<div style="font-weight:700; font-size:11.5px; color:#0f172a;">' + esc(c.razao_social) + '</div>' +

                '</div>' +
                '<div style="padding-bottom:9px; margin-bottom:9px; border-bottom:1px solid #cbd5e1; font-size:11px; line-height:1.45;">' +
                '<div style="font-weight:700; font-size:11.5px; color:#0f172a;">' + esc(cli.razao_social) + '</div>' +
                '<div><strong>CNPJ:</strong> ' + esc(cli.cnpj) + ' &nbsp;&nbsp; <strong>IE:</strong> ' + esc(cli.ie) + '</div>' +
                '<div><strong>Endereço:</strong> ' + esc(cli.endereco) + ' &nbsp; <strong>Município:</strong> ' + esc(cli.municipio) + ' - <strong>UF:</strong> ' + esc(cli.uf) + ' &nbsp; <strong>CEP:</strong> ' + esc(cli.cep) + '</div>' +
                '<div><strong>Contato:</strong> ' + esc(cli.contato_nome) + ' &nbsp; <strong>Telefone:</strong> ' + esc(cli.contato_telefone) + ' &nbsp; <strong>Celular:</strong> ' + esc(cli.contato_celular) + ' &nbsp; <strong>E-mail:</strong> ' + esc(cli.contato_email) + '</div>' +
                (d.eh_aditivo || d.contrato_vinculado ? '<div><strong>Contrato Base:</strong> ' + esc(d.contrato_vinculado || '—') + '</div>' : '') +
                '</div>' +
                '<div style="display:grid; grid-template-columns:1.2fr 1.1fr 0.9fr; gap:8px; padding-bottom:8px; margin-bottom:8px; border-bottom:1px solid #cbd5e1; font-size:11px;">' +
                '<div><strong>Período:</strong> ' + esc(d.data_inicio || '—') + (d.data_fim && d.data_fim !== d.data_inicio ? ' à ' + esc(d.data_fim) : '') + '</div>' +
                '<div><strong>Condição de Pagamento:</strong> ' + esc(d.condicao_pagamento || '—') + '</div>' +
                '<div style="text-align:right;"><strong>Validade da proposta:</strong> ' + esc(d.validade_proposta || '—') + '</div>' +
                '</div>' +
                '<div style="padding-bottom:9px; margin-bottom:6px; font-size:11px; line-height:1.45;">' +
                '<div><strong>Local de instalação:</strong> ' + esc(imp.local_instalacao || d.instalacao_linha1 || '—') + '</div>' +
                '<div><strong>Endereço:</strong> ' + esc(imp.endereco_instalacao || d.instalacao_linha2 || '—') + '</div>' +
                '<div><strong>CEP:</strong> ' + esc(imp.cep_instalacao || cli.cep || '—') + '</div>' +
                '</div>' +
                '<div style="border-top:1px solid #cbd5e1; border-bottom:1px solid #cbd5e1; padding:5px 0; text-align:center; font-weight:700; font-size:12px; color:#475569;">' + esc(imp.titulo_tabela_produtos || 'Produtos para Locação') + '</div>' +
                tabelaProdutosHtml +
                valoresCompHtml +
                infoBoxHtml +
                (imp.observacao ? '<div style="margin-top:12px;"><div style="text-align:center; font-weight:700; font-size:11.5px; color:#475569; margin-bottom:4px;">Observação</div><div style="border:1px solid #cbd5e1; border-radius:4px; padding:8px 10px; min-height:34px; font-size:11px; color:#1e293b; white-space:pre-wrap;">' + esc(imp.observacao) + '</div></div>' : '') +
                '</div></div>';
        }

        function obterUrlImagemAceite() {
            if (!estado.dados || !estado.dados.aceite) return null;
            if (visao() === 'mobile' && estado.dados.aceite.mobile_url) return estado.dados.aceite.mobile_url;
            return estado.dados.aceite.url || null;
        }

        function exibirImagemAceite() {
            var urlImg = obterUrlImagemAceite();
            var d = estado.dados || {};
            var jaAssinado = !!(d.assinatura_url || estado.aprovado);
            var imgHtml = urlImg ? '<img src="' + esc(urlImg) + '" alt="Aceite da Proposta" style="width:100%; height:auto; display:block;">' : '';
            if (jaAssinado && d.assinatura_url) {
                var htmlFinal = imgHtml +
                    '<div style="padding:20px 24px; background:#f8fafc; border-top:1px solid #e2e8f0; text-align:center;">' +
                    '<div style="font-size:15px; font-weight:800; color:#16a34a; margin-bottom:8px;">✓ Proposta Pré-Aprovada e Assinada!</div>' +
                    '<div style="display:inline-block; background:#fff; border:1px solid #cbd5e1; border-radius:8px; padding:10px 20px;">' +
                    '<img src="' + esc(d.assinatura_url) + '" alt="Assinatura Salva" style="max-height:110px; max-width:340px; object-fit:contain; display:block; margin:0 auto;">' +
                    '</div>' +
                    (d.aceite_publico_em ? '<div style="font-size:12px; color:#64748b; margin-top:6px;">Data/Hora do Aceite: ' + esc(new Date(d.aceite_publico_em).toLocaleString('pt-BR')) + '</div>' : '') +
                    '</div>';
                secaoAceite.innerHTML = htmlFinal;
                secaoAceite.style.display = 'block';
                modalAceiteBody.innerHTML = htmlFinal;
                modalAceite.style.display = 'flex';
                return;
            }

            modalAceiteBody.innerHTML =
                imgHtml +
                '<div style="padding:20px 24px; background:#f8fafc; border-top:2px solid #e2e8f0; text-align:center;">' +
                '<div style="font-size:15px; font-weight:800; color:#0f172a; margin-bottom:4px;">Assine abaixo para Aprovar a Proposta</div>' +
                '<div style="font-size:12.5px; color:#475569; margin-bottom:12px;">Desenhe sua assinatura no quadro abaixo utilizando o mouse ou o dedo na tela:</div>' +
                '<div style="max-width:520px; margin:0 auto; background:#fff; border:2px dashed #94a3b8; border-radius:10px; overflow:hidden; position:relative;">' +
                '<canvas id="pp-canvas-assinatura" width="520" height="170" style="width:100%; height:170px; display:block; touch-action:none; cursor:crosshair;"></canvas>' +
                '</div>' +
                '<div id="pp-assinatura-erro" style="display:none; color:#dc2626; font-size:12.5px; font-weight:700; margin-top:8px;">Por favor, assine no quadro acima antes de confirmar.</div>' +
                '<div style="display:flex; justify-content:center; gap:12px; margin-top:14px; flex-wrap:wrap;">' +
                '<button type="button" id="pp-btn-limpar-assinatura" style="padding:10px 18px; border-radius:8px; border:1px solid #cbd5e1; background:#fff; color:#334155; font-weight:700; font-size:13px; cursor:pointer;">Limpar Assinatura</button>' +
                '<button type="button" id="pp-btn-confirmar-assinatura" style="padding:10px 24px; border-radius:8px; border:none; background:#16a34a; color:#fff; font-weight:800; font-size:14px; cursor:pointer; box-shadow:0 4px 12px rgba(22,163,74,0.28);">✓ Confirmar Assinatura e Aprovar</button>' +
                '</div>' +
                '</div>';
            modalAceite.style.display = 'flex';

            var canvas = document.getElementById('pp-canvas-assinatura');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 2.4;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            var desenhando = false;
            var temTraco = false;

            function posCanvas(ev) {
                var rect = canvas.getBoundingClientRect();
                var scaleX = canvas.width / (rect.width || 1);
                var scaleY = canvas.height / (rect.height || 1);
                var clientX = ev.touches && ev.touches[0] ? ev.touches[0].clientX : ev.clientX;
                var clientY = ev.touches && ev.touches[0] ? ev.touches[0].clientY : ev.clientY;
                return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
            }
            function iniciarTraco(ev) {
                desenhando = true;
                temTraco = true;
                var erroEl = document.getElementById('pp-assinatura-erro');
                if (erroEl) erroEl.style.display = 'none';
                var p = posCanvas(ev);
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                if (ev.cancelable) ev.preventDefault();
            }
            function moverTraco(ev) {
                if (!desenhando) return;
                var p = posCanvas(ev);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
                if (ev.cancelable) ev.preventDefault();
            }
            function finalizarTraco() { desenhando = false; }

            canvas.addEventListener('mousedown', iniciarTraco);
            canvas.addEventListener('mousemove', moverTraco);
            window.addEventListener('mouseup', finalizarTraco);
            canvas.addEventListener('touchstart', iniciarTraco, { passive: false });
            canvas.addEventListener('touchmove', moverTraco, { passive: false });
            window.addEventListener('touchend', finalizarTraco);

            var btnLimpar = document.getElementById('pp-btn-limpar-assinatura');
            if (btnLimpar) {
                btnLimpar.addEventListener('click', function () {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    temTraco = false;
                });
            }
            var btnConfirmar = document.getElementById('pp-btn-confirmar-assinatura');
            if (btnConfirmar) {
                btnConfirmar.addEventListener('click', function () {
                    if (!temTraco) {
                        var erroEl = document.getElementById('pp-assinatura-erro');
                        if (erroEl) erroEl.style.display = 'block';
                        return;
                    }
                    var dataUrl = canvas.toDataURL('image/png');
                    btnConfirmar.disabled = true;
                    btnConfirmar.textContent = 'Salvando assinatura...';
                    fetch('/api/public/proposta/' + encodeURIComponent(codigo) + '/' + encodeURIComponent(token) + '/aprovar', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        credentials: 'omit',
                        referrerPolicy: 'no-referrer',
                        body: JSON.stringify({ assinatura_base64: dataUrl })
                    }).then(function (r) { return r.json(); }).then(function (resp) {
                        estado.aprovado = true;
                        if (estado.dados) {
                            estado.dados.aceite_publico_em = (resp && resp.aceite_publico_em) || new Date().toISOString();
                            estado.dados.assinatura_url = (resp && resp.assinatura_url) || dataUrl;
                            if (containerSimples) containerSimples.innerHTML = gerarHtmlVersaoSimples(estado.dados);
                        }
                        exibirImagemAceite();
                    }).catch(function () {
                        btnConfirmar.disabled = false;
                        btnConfirmar.textContent = '✓ Confirmar Assinatura e Aprovar';
                    });
                });
            }
        }

        document.getElementById('pp-btn-imprimir').addEventListener('click', function () {
            if (!estado.dados) return;
            containerSimples.innerHTML = gerarHtmlVersaoSimples(estado.dados);
            window.print();
        });

        document.getElementById('pp-btn-aprovar').addEventListener('click', function () {
            if (!estado.dados) return;
            exibirImagemAceite();
        });

        function mensagem(titulo, texto) {
            raiz.style.background = 'transparent';
            raiz.innerHTML = '<div class="pp-msg"><h1></h1><p></p></div>';
            raiz.querySelector('h1').textContent = titulo;
            raiz.querySelector('p').textContent = texto;
        }

        function visao() { return window.innerWidth <= 768 ? 'mobile' : 'desktop'; }

        function desenhar() {
            if (!estado.dados) return;
            var v = visao();
            estado.view = v;
            if (typeof window.renderListaBoxesCompletaHtml === 'function') {
                raiz.innerHTML = window.renderListaBoxesCompletaHtml(estado.boxes, v, { proposta: estado.dados });
            } else {
                raiz.innerHTML = estado.boxes.map(function (b) {
                    return window.boxRenderHtml(b, v, { proposta: estado.dados });
                }).join('');
            }
            if (fabBar) fabBar.style.display = 'flex';
            if (containerSimples) containerSimples.innerHTML = gerarHtmlVersaoSimples(estado.dados);
            if (typeof window.ajustarAlturaQuadroValoresBoxes === 'function') {
                requestAnimationFrame(function () { window.ajustarAlturaQuadroValoresBoxes(raiz); });
            }
        }

        var ultimaVisao = null;
        window.addEventListener('resize', function () {
            if (estado.dados && visao() !== ultimaVisao) { ultimaVisao = visao(); desenhar(); }
        });

        if (!codigo || !token) { mensagem('Link inválido', 'Confira o endereço recebido ou solicite um novo link.'); return; }

        fetch('/api/public/proposta/' + encodeURIComponent(codigo) + '/' + encodeURIComponent(token), {
            headers: { 'Accept': 'application/json' }, cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer'
        }).then(function (r) {
            return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, body: j }; });
        }).then(function (r) {
            if (r.status === 200 && r.body && r.body.dados) {
                estado.dados = r.body.dados;
                estado.boxes = r.body.boxes || [{ tipo: 'quadro_evento' }];
                ultimaVisao = visao();
                desenhar();
            } else if (r.status === 410) {
                mensagem('Proposta expirada', 'Este link não está mais ativo. Entre em contato com a América Rental para receber uma nova proposta.');
            } else if (r.status === 429) {
                mensagem('Muitas tentativas', 'Aguarde alguns minutos e tente novamente.');
            } else {
                mensagem('Link inválido ou expirado', 'Confira o endereço recebido ou solicite um novo link à América Rental.');
            }
        }).catch(function () {
            mensagem('Não foi possível carregar', 'Verifique sua conexão e atualize a página.');
        });
    })();
    </script>
</body>
</html>
