<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário da Aula — UniAmérica</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #0e7490;
            --primary-hover: #155e75;
            --border: #e2e8f0;
            --success: #16a34a;
            --danger: #dc2626;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            max-width: 680px;
            width: 100%;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.07);
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .header {
            background: #0e7490;
            color: white;
            padding: 26px 24px;
            text-align: center;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.16);
            color: #fff;
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 800;
            line-height: 1.3;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 0.92rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .content {
            padding: 24px;
        }

        .info-banner {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #166534;
            padding: 13px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.86rem;
            line-height: 1.5;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .question-card {
            background: #f8fafc;
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 12px;
        }

        .question-title {
            font-weight: 700;
            font-size: 0.96rem;
            color: #1e293b;
            line-height: 1.4;
        }

        .pts-badge {
            background: #eef2ff;
            color: #4338ca;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-label {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 0.92rem;
            color: #334155;
            font-weight: 500;
        }

        .option-label:hover {
            border-color: #38bdf8;
            background: #f0f9ff;
        }

        .option-label input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            margin: 0;
            flex-shrink: 0;
        }

        .btn-submit {
            background: var(--primary);
            color: #fff;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .message {
            text-align: center;
            padding: 36px 24px;
        }

        .message i {
            font-size: 3.8rem;
            display: block;
            margin-bottom: 12px;
        }

        .message.success i { color: var(--success); }
        .message.error i { color: var(--danger); }

        .score-box {
            display: inline-block;
            margin: 14px 0 18px;
            padding: 12px 24px;
            background: #f0fdf4;
            border: 2px solid #86efac;
            border-radius: 14px;
            color: #15803d;
            font-weight: 800;
            font-size: 1.15rem;
        }

        .loading {
            text-align: center;
            padding: 48px 20px;
            color: var(--text-muted);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="loading">
            <i class="ph ph-spinner" style="font-size: 2.2rem; animation: spin 1s linear infinite;"></i>
            <p style="margin-top: 10px;">Carregando formulário da aula...</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const app = document.getElementById('app');
        let formDados = null;

        function esc(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        async function init() {
            if (!token) {
                showError('Link inválido ou incompleto. Verifique o link recebido no seu e-mail.');
                return;
            }
            try {
                const res = await fetch(`/api/public/uniamerica-formulario/${encodeURIComponent(token)}`);
                const data = await res.json();
                if (!res.ok) {
                    showError(data.error || 'Não foi possível carregar este formulário.');
                    return;
                }
                formDados = data;
                if (data.respondido) {
                    renderJaRespondido(data);
                    return;
                }
                renderFormulario();
            } catch (e) {
                showError('Erro de conexão ao carregar o formulário. Tente novamente em instantes.');
            }
        }

        function renderFormulario() {
            const pergs = Array.isArray(formDados.perguntas) ? formDados.perguntas : [];
            if (pergs.length === 0) {
                showError('Nenhuma pergunta cadastrada para esta aula.');
                return;
            }
            const primeiroNome = String(formDados.colaborador_nome || '').trim().split(' ')[0] || 'Colaborador';

            let html = `
                <div class="header">
                    <div class="header-badge">
                        <i class="ph ph-graduation-cap"></i> UniAmérica — ${esc(formDados.curso_nome)}
                    </div>
                    <h1>Aula ${esc(formDados.aula_ordem)}: ${esc(formDados.aula_titulo)}</h1>
                    <p>Olá, <strong>${esc(primeiroNome)}</strong>! Responda às questões da aula abaixo:</p>
                </div>
                <div class="content">
                    <div class="info-banner">
                        <i class="ph ph-check-circle" style="font-size:1.3rem;flex-shrink:0;margin-top:1px;"></i>
                        <div>
                            <strong>Pontuação do Formulário:</strong> Cada pergunta respondida corretamente soma <strong>1 ponto</strong> na sua nota do curso (e 0 quando incorreta).
                            ${formDados.total_missoes > 0 ? `<br><span style="color:#1e3a8a;">Você também possui <strong>${formDados.total_missoes} missão(ões) da semana</strong> disponíveis na tela <strong>Missões</strong> do sistema!</span>` : ''}
                        </div>
                    </div>
                    <form id="form-aula-ua" onsubmit="enviarRespostas(event)">
            `;

            pergs.forEach((q, idx) => {
                html += `
                    <div class="question-card">
                        <div class="question-header">
                            <div class="question-title">${idx + 1}. ${esc(q.pergunta)}</div>
                            <span class="pts-badge">Vale 1 pt</span>
                        </div>
                        <div class="options-list">
                            ${(q.opcoes || []).map((op, opIdx) => `
                                <label class="option-label">
                                    <input type="radio" name="q_${esc(q.id)}" value="${opIdx}">
                                    <span>${esc(op)}</span>
                                </label>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            html += `
                        <button type="submit" class="btn-submit" id="btn-submit">
                            <i class="ph ph-paper-plane-tilt"></i> Enviar Respostas do Formulário
                        </button>
                    </form>
                </div>
            `;
            app.innerHTML = html;
        }

        async function enviarRespostas(ev) {
            ev.preventDefault();
            const pergs = Array.isArray(formDados.perguntas) ? formDados.perguntas : [];
            const respostas = {};

            for (let i = 0; i < pergs.length; i++) {
                const q = pergs[i];
                const checked = document.querySelector(`input[name="q_${q.id}"]:checked`);
                if (!checked) {
                    alert(`Por favor, selecione uma resposta para a pergunta ${i + 1}.`);
                    return;
                }
                respostas[q.id] = parseInt(checked.value, 10);
            }

            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.innerHTML = '<i class="ph ph-spinner" style="animation: spin 1s linear infinite;"></i> Enviando respostas...';

            try {
                const res = await fetch(`/api/public/uniamerica-formulario/${encodeURIComponent(token)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ respostas })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Erro ao enviar respostas.');

                renderJaRespondido({
                    ...formDados,
                    respondido: true,
                    pontos_calculados: data.pontos_calculados,
                    acertos: data.acertos,
                    total_perguntas: data.total_perguntas,
                    perguntas: data.perguntas || formDados.perguntas
                });
            } catch (e) {
                alert('Erro: ' + e.message);
                btn.disabled = false;
                btn.innerHTML = '<i class="ph ph-paper-plane-tilt"></i> Enviar Respostas do Formulário';
            }
        }

        function renderJaRespondido(data) {
            const pts = Number(data.pontos_calculados != null ? data.pontos_calculados : (data.acertos || 0));
            const total = Number(data.total_perguntas || (data.perguntas ? data.perguntas.length : 0));
            const pergs = Array.isArray(data.perguntas) ? data.perguntas : [];

            let gabaritoHtml = '';
            if (pergs.length > 0 && pergs.some(q => q.correta_idx !== undefined)) {
                gabaritoHtml = `
                    <div style="text-align:left;margin-top:20px;display:flex;flex-direction:column;gap:10px;">
                        <strong style="font-size:0.9rem;color:#334155;">Resumo das suas respostas:</strong>
                        ${pergs.map((q, idx) => {
                            const rIdx = q.resposta_dada !== undefined && q.resposta_dada !== null ? Number(q.resposta_dada) : -1;
                            const acertou = rIdx === Number(q.correta_idx);
                            const respTxt = (q.opcoes && q.opcoes[rIdx] !== undefined) ? q.opcoes[rIdx] : '—';
                            return `
                                <div style="padding:10px 14px;border-radius:10px;background:${acertou ? '#f0fdf4' : '#fef2f2'};border:1px solid ${acertou ? '#bbf7d0' : '#fecaca'};display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:0.85rem;">
                                    <div>
                                        <div style="font-weight:700;color:#0f172a;">${idx + 1}. ${esc(q.pergunta)}</div>
                                        <div style="color:#475569;margin-top:2px;">Sua resposta: <strong>${esc(respTxt)}</strong></div>
                                    </div>
                                    <span style="padding:4px 10px;border-radius:999px;font-weight:700;font-size:0.78rem;background:${acertou ? '#16a34a' : '#dc2626'};color:#fff;white-space:nowrap;">
                                        ${acertou ? '+1 pt (Acertou)' : '0 pt (Errou)'}
                                    </span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            app.innerHTML = `
                <div class="header">
                    <div class="header-badge">
                        <i class="ph ph-graduation-cap"></i> UniAmérica — ${esc(data.curso_nome || '')}
                    </div>
                    <h1>Aula ${esc(data.aula_ordem || '')}: ${esc(data.aula_titulo || '')}</h1>
                </div>
                <div class="message success">
                    <i class="ph ph-check-circle"></i>
                    <h2 style="margin:0 0 6px;font-size:1.3rem;color:#0f172a;">Formulário Respondido com Sucesso!</h2>
                    <p style="margin:0;color:#64748b;font-size:0.92rem;">Sua nota já foi registrada automaticamente no curso.</p>
                    <div class="score-box">
                        Nota obtida: ${pts} / ${total} ponto${pts === 1 ? '' : 's'}
                    </div>
                    ${gabaritoHtml}
                    <div style="margin-top:22px;padding:14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;color:#1e3a8a;font-size:0.86rem;line-height:1.45;">
                        <i class="ph ph-rocket-launch"></i> Você também pode consultar suas respostas e preencher as <strong>Missões do Curso</strong> acessando o menu <strong>Missões</strong> no sistema Fluxo AR.
                    </div>
                </div>
            `;
        }

        function showError(msg) {
            app.innerHTML = `
                <div class="message error">
                    <i class="ph ph-x-circle"></i>
                    <h2 style="margin:0 0 10px;font-size:1.2rem;color:#0f172a;">Não foi possível abrir o formulário</h2>
                    <p style="margin:0;color:#64748b;font-size:0.92rem;">${esc(msg)}</p>
                </div>
            `;
        }

        init();
    </script>
</body>
</html>
